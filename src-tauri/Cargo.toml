[package]
name = "parampara"
version = "1.3.0"
edition = "2021"
description = "Hindu calendar and companion app for Melbourne"

[[bin]]
name = "parampara"
path = "src/main.rs"

[dependencies]
parampara-engine = { path = "../engine" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
